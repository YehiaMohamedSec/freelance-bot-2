name: hunter

on:
  workflow_dispatch:

concurrency:
  group: hunter
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Run bot
        run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Persist seen_jobs.txt
        if: always()
        run: |
          git config user.name "hunter-bot"
          git config user.email "hunter-bot@users.noreply.github.com"
          git add seen_jobs.txt
          git diff --cached --quiet || (git commit -m "update seen jobs" && git push)